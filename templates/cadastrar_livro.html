{% extends 'base.html' %}

{% block titulo %}
Cadastrar Livro
{% endblock %}

{% block conteudo %}

<div class="row justify-content-center">

```
<div class="col-md-8">

    <div class="card shadow p-4">

        <h2 class="text-center mb-4">
            📚 Cadastrar Novo Livro
        </h2>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Título do Livro
                </label>

                <input
                    type="text"
                    name="titulo"
                    class="form-control"
                    placeholder="Digite o título do livro"
                    required
                >

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Autor
                </label>

                <input
                    type="text"
                    name="autor"
                    class="form-control"
                    placeholder="Digite o nome do autor"
                    required
                >

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Gênero
                </label>

                <select
                    name="categoria"
                    class="form-select"
                    required
                >

                    <option value="">
                        Selecione o Gênero
                    </option>

                    <option value="Fantasia">
                        Fantasia
                    </option>

                    <option value="Romance">
                        Romance
                    </option>

                    <option value="Mistério">
                        Mistério
                    </option>

                    <option value="Ficção Científica">
                        Ficção Científica
                    </option>

                    <option value="Infantil">
                        Infantil
                    </option>

                    <option value="Biografia">
                        Biografia
                    </option>

                    <option value="Aventura">
                        Aventura
                    </option>

                    <option value="Terror">
                        Terror
                    </option>

                    <option value="Drama">
                        Drama
                    </option>

                    <option value="História">
                        História
                    </option>

                </select>

            </div>

            <div class="d-flex gap-2">

                <button
                    type="submit"
                    class="btn btn-success"
                >
                     Salvar Livro
                </button>

                <a
                    href="/livros"
                    class="btn btn-secondary"
                >
                     Cancelar
                </a>

            </div>

        </form>

    </div>

</div>
```

</div>

{% endblock %}
