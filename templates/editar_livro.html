{% extends 'base.html' %}

{% block titulo %}
Editar Livro
{% endblock %}

{% block conteudo %}

<h1>Editar Livro</h1>

<form method="POST">

    <label>Título:</label>
    <br>
    <input
        type="text"
        name="titulo"
        value="{{ livro.titulo }}"
        required
    >

    <br><br>

    <label>Autor:</label>
    <br>
    <input
        type="text"
        name="autor"
        value="{{ livro.autor }}"
        required
    >

    <br><br>

    <label>Categoria:</label>
    <br>
    <input
        type="text"
        name="categoria"
        value="{{ livro.categoria }}"
        required
    >

    <br><br>

    <button type="submit">
        Salvar Alterações
    </button>

</form>

{% endblock %}
