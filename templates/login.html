{% extends 'base.html' %}

{% block titulo %}
Login
{% endblock %}

{% block conteudo %}

<h1>Login Administrativo</h1>

<form method="POST">

    <label>Usuário:</label>
    <br>
    <input type="text" name="usuario" required>

    <br><br>

    <label>Senha:</label>
    <br>
    <input type="password" name="senha" required>

    <br><br>

    <button type="submit">
        Entrar
    </button>

</form>

{% endblock %}
